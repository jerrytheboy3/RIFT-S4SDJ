html[data-lang="hi"] body,html[data-lang="kn"] body{line-height:1.6}
html[data-lang="hi"] :is(.h-hero,.h1,.h2,.h3,.g-title,.answer-line,.brow-en,.sec-top h2,.cta-h,.mani,.ocard-name,.tool-big,.tool-head h3,.best-hero strong,.story h2,.stat-grid b,.k-row,.foot-giant,.sdg-h,.vault-h),
html[data-lang="kn"] :is(.h-hero,.h1,.h2,.h3,.g-title,.answer-line,.brow-en,.sec-top h2,.cta-h,.mani,.ocard-name,.tool-big,.tool-head h3,.best-hero strong,.story h2,.stat-grid b,.k-row,.foot-giant,.sdg-h,.vault-h){line-height:1.3}
/* Hindi and Kannada words run longer: the LED board and fee amounts wrap inside their box instead of pushing past it. */
.led{max-width:100%}
html:is([data-lang="hi"],[data-lang="kn"]) .led span[data-led]{white-space:pre-wrap;line-height:1.2}
html:is([data-lang="hi"],[data-lang="kn"]) .fee .amt{white-space:normal;text-align:right;max-width:60%}
html[data-lang="hi"] .h-hero .w,html[data-lang="kn"] .h-hero .w{padding:.1em .05em .26em;margin:-.1em -.05em -.26em}
html[data-lang="kn"] .h-hero{font-size:clamp(2.2rem,1rem + 4.4vw,5.4rem)}
html[data-lang="hi"] .h-hero{font-size:clamp(2.6rem,1.2rem + 5vw,6.2rem)}
html[data-lang="kn"] .k-row{font-size:clamp(2.8rem,1.2rem + 6vw,8rem)}
html[data-lang="kn"] :is(.h1,.cta-h){font-size:clamp(2.1rem,1.3rem + 3vw,3.9rem)}
/* Language menu in the top bar */
.lang-wrap{position:relative}
.lang-badge{display:grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:7px;font-size:.75rem;font-weight:700;line-height:1;color:var(--ink);box-shadow:inset 0 0 0 1.6px currentColor}
.lang-menu{position:absolute;right:-6px;top:calc(100% + 12px);z-index:70;min-width:178px;padding:6px;border-radius:18px;background:var(--surface);
  box-shadow:0 0 0 1px var(--hair),0 20px 50px -12px rgba(0,0,0,.3);transform-origin:90% 0}
.lang-menu.pop{animation:spot-in .32s var(--ease-out)}
.lang-menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--ink);font-size:1rem;font-weight:600;text-align:left}
.lang-menu button[lang="hi"]{font-family:"Anek Devanagari",var(--font)}
.lang-menu button[lang="kn"]{font-family:"Anek Kannada",var(--font)}
.lang-menu button:hover,.lang-menu button:focus-visible{background:var(--surface-2);outline:none}
.lm-ck{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--line);transition:box-shadow .2s,background-color .2s}
.lang-menu [aria-checked="true"] .lm-ck{background:var(--accent);box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 9px var(--accent)}
.seg button[lang="hi"]{font-family:"Anek Devanagari",var(--font)}.seg button[lang="kn"]{font-family:"Anek Kannada",var(--font)}
/* Danger button and confirm dialog */
.btn-danger{background:color-mix(in srgb,var(--red) 12%,var(--surface));color:var(--red)}
.btn-danger:hover{background:color-mix(in srgb,var(--red) 20%,var(--surface))}
.ov-dialog .btn-danger{background:var(--red);color:#fff}
.ov-dialog .btn-danger:hover{background:color-mix(in srgb,var(--red) 88%,#000)}
.confirm-ic{display:grid;place-items:center;width:52px;height:52px;margin-bottom:14px;border-radius:16px;background:color-mix(in srgb,var(--red) 14%,var(--surface));color:var(--red)}
.confirm-ic .ic{width:26px;height:26px}
.confirm-row{margin-top:24px;justify-content:flex-end}
@media (max-width:767.98px){.confirm-row .btn{flex:1}}
/* ================================================================
   OVERHAUL: floating glass nav, sliding nav highlight, footer,
   back-to-top, richer primary buttons
   ================================================================ */
:root{--pill-hi:rgba(255,255,255,.55);--pill-sh:0 12px 34px -14px rgba(0,0,0,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill-hi:rgba(255,255,255,.07);--pill-sh:0 14px 40px -12px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--pill-hi:rgba(255,255,255,.07);--pill-sh:0 14px 40px -12px rgba(0,0,0,.7)}
@media (min-width:768px){
  :root{--nav-h:66px}
  .topbar{display:flex;align-items:center;background:transparent;border-bottom:0;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none;view-transition-name:none}
  .topbar-in{pointer-events:auto;width:calc(min(100%, var(--maxw)) - 2 * var(--gut) + 28px);max-width:none;height:52px;padding:0 8px 0 16px;border-radius:999px;
    background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
    box-shadow:0 0 0 1px var(--hair),var(--pill-sh),inset 0 1px 0 var(--pill-hi);transition:box-shadow .4s var(--ease);view-transition-name:topbar}
}
.mainnav{position:relative}
.mainnav a{position:relative;z-index:1}
.mainnav a[aria-current="page"],.mainnav a[aria-current="page"]:hover{background:transparent}
.nav-ind{position:absolute;left:0;top:50%;height:34px;margin-top:-17px;border-radius:980px;background:var(--hair);opacity:0;pointer-events:none;
  box-shadow:inset 0 1px 0 var(--pill-hi);transition:transform .55s var(--spring),width .55s var(--spring),opacity .25s var(--ease)}
.btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn-primary:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--accent-2) 86%,#fff),var(--accent-2))}
.btn-primary:focus-visible{box-shadow:var(--ring)}
.footer{padding:60px 0 0;overflow:hidden}
.foot-cols{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.2fr)}
#footer-guides{columns:2;column-gap:28px}
#footer-guides{padding-top:2px}
#footer-guides li{break-inside:avoid;margin:0 0 9px}
.foot-giant{margin:34px 0 0;padding-bottom:.02em;font-family:var(--font-d);font-weight:800;font-size:min(13.5vw,12rem);line-height:.82;letter-spacing:-.06em;white-space:nowrap;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 18%,transparent) 10%,transparent 92%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-user-select:none;user-select:none;pointer-events:none;transform:translateY(.12em)}
.totop{position:fixed;right:22px;bottom:24px;z-index:55;display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;color:var(--ink);
  background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 1px var(--hair),var(--pill-sh);
  opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:opacity .3s var(--ease),transform .5s var(--spring),background-color .2s}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop:hover{background:var(--surface)}
.totop:active{transform:scale(.92)}
.totop:focus-visible{outline:none;box-shadow:var(--ring)}
.totop .ic{width:20px;height:20px}
@media (max-width:767.98px){
  .totop{right:16px;bottom:calc(72px + env(safe-area-inset-bottom))}
  body.in-guide .totop{display:none}
  .foot-cols{grid-template-columns:minmax(0,1fr)}
}
@media print{.totop,.foot-giant{display:none!important}}
/* ---------- New-guide pieces: notes, verified line, filters, helper tools, words to know ---------- */
.notice-info{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.notice-info::before{background:var(--accent)}
.g-verified{display:flex;align-items:center;gap:7px;margin:12px 2px 6px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.g-verified .ic{width:15px;height:15px;color:#1E9E57;stroke-width:2.6}
.gfilter{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:-14px 0 26px}
.gfilter .filter{display:flex;flex-wrap:wrap;gap:8px}
.gcount{font-size:.9375rem;font-weight:500}
@media (max-width:1023.98px) and (min-width:768px){.bento>li:last-child:nth-child(even){grid-column:span 2}}
.tool-card{margin:26px 0 8px;padding:22px 22px 20px;border-radius:24px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hair)}
.tool-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.tool-head h3{font-family:var(--font-d);font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tool-head .muted{font-size:.9375rem;margin-top:2px}
.tool-row{display:grid;grid-template-columns:minmax(0,320px);gap:14px}
.tool-row.tool-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tool-card .input{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:1.0625rem;
  box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s var(--ease)}
.tool-card .input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.tool-out:not(:empty){margin-top:18px;animation:rise-in .5s var(--ease-out)}
.tool-status{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:1.0625rem;line-height:1.4}
.tool-status .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:.45em}
.ts-green .dot{background:#30D158;box-shadow:0 0 0 4px rgba(48,209,88,.18)}.ts-amber .dot{background:#FF9F0A;box-shadow:0 0 0 4px rgba(255,159,10,.18)}.ts-red .dot{background:#FF3B30;box-shadow:0 0 0 4px rgba(255,59,48,.18)}
.tool-dl{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 10px}
.tool-dl>div{flex:1 1 150px;padding:12px 14px;border-radius:16px;background:var(--surface)}
.tool-dl dt{font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.tool-dl dd{margin:2px 0 0;font-family:var(--font-d);font-size:1.25rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tool-big{font-family:var(--font-d);font-size:2.5rem;font-weight:700;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.tool-big span{font-size:1.0625rem;font-weight:600;letter-spacing:0;color:var(--ink-2);margin-left:6px}
.tool-card .btn-row{margin-top:12px}
.terms-wrap{margin-top:26px}
.terms{display:grid;gap:10px;padding:4px 0 14px}
.terms>div{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--hair)}
.terms>div:first-child{border-top:0}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--ink-2)}
@media (max-width:767.98px){.tool-row.tool-3{grid-template-columns:minmax(0,1fr)}.terms>div{grid-template-columns:minmax(0,1fr);gap:4px}.gfilter{margin-top:-6px}
  .gfilter .filter{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * var(--gut));padding:2px var(--gut);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .gfilter .filter::-webkit-scrollbar{display:none}
  .gfilter .chip-inline{flex:none}
  .dock{display:grid;grid-template-columns:repeat(4,auto);gap:10px;padding:12px}
  .dock-x,.dock-sep{display:none}}
/* ================================================================
   PAGE FX: header shapes, tilt, rush-chart readout, route lines,
   bursts, live fair-price bands, entrance choreography
   ================================================================ */
.page{position:relative;isolation:isolate}
.floaters{position:absolute;top:0;left:calc(50% - (100vw - var(--sbw,0px)) / 2);width:calc(100vw - var(--sbw,0px));height:440px;z-index:-1;pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.fl{position:absolute;left:0;top:0;width:var(--s);height:var(--s);transform:scale(0);will-change:transform}
.fl-disc{border-radius:50%;background:linear-gradient(90deg,var(--c) 50%,transparent 50%);box-shadow:inset 0 0 0 max(2px,calc(var(--s) * .11)) var(--c)}
.fl-sq{border-radius:24%;background:var(--c)}
.fl-tri{clip-path:polygon(50% 5%,96% 90%,4% 90%);background:var(--c)}
.fl-plus{background:linear-gradient(var(--c),var(--c)) center/100% 24% no-repeat,linear-gradient(var(--c),var(--c)) center/24% 100% no-repeat}
.fl-ring{border-radius:50%;box-shadow:inset 0 0 0 max(2px,calc(var(--s) * .1)) var(--c)}
.fl-dot{border-radius:50%;background:var(--c)}
@media (max-width:767.98px){.floaters{height:280px;opacity:.6}}
/* Office cards tilt like the guide cards */
.ocard{position:relative;transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .7s var(--ease-out),box-shadow .6s var(--ease-out)}
.ocard.card-hover:hover{transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px)}
.ocard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .5s var(--ease);
  background:radial-gradient(520px circle at var(--mx,50%) var(--my,0%),rgba(255,138,61,.13),rgba(255,72,128,.05) 30%,transparent 55%)}
.ocard:hover::after{opacity:1}
.ocard .tile,.srow .tile{transition:transform .7s var(--spring)}
.ocard:hover .tile{transform:scale(1.1) rotate(-6deg)}
.srow:hover .tile{transform:scale(1.12) rotate(-8deg)}
/* Calmest-time board: the LED leans toward the pointer and a warm glow follows it */
.best-hero{position:relative;overflow:hidden}
.best-hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s var(--ease);
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,176,32,.16),transparent 60%)}
.best-hero.tilting::after{opacity:1}
.best-hero .led{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s var(--ease-out)}
.best-hero.tilting .led{transition-duration:.2s}
/* Slips lean toward the pointer, with a sheen across the paper */
.slip-stage[data-tilt] .slip,.trip-card[data-tilt] .slip{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s var(--ease-out)}
.slip-stage.tilting .slip,.trip-card.tilting .slip{transition-duration:.2s;background-image:radial-gradient(300px circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.55),rgba(255,255,255,0) 60%)}
/* Rush chart: cells sweep in, swell under the pointer, and a readout names the slot */
.heat{position:relative}
.heat-c{transform:scale(var(--z,1));transition:transform .22s var(--ease-out),box-shadow .22s var(--ease-out);animation:heat-in .55s var(--ease-out) backwards;animation-delay:calc(var(--c,0) * 22ms + var(--r,0) * 45ms)}
.heat-c.big{position:relative;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.18)}
@keyframes heat-in{from{opacity:0;transform:scale(.3)}}
.heat-h,.heat-d{transition:color .2s}
.heat-h.hl,.heat-d.hl{color:var(--accent)}
.heat-tip{position:absolute;left:0;top:0;z-index:5;padding:6px 10px;border-radius:9px;background:var(--toast-bg);color:var(--toast-ink);font-size:.75rem;font-weight:600;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .15s;box-shadow:var(--shadow-2)}
.heat-tip.on{opacity:1}
/* Route lines: a gradient line draws down through numbered markers as you read */
[data-route]{position:relative}
[data-route]::before,[data-route]::after{content:"";position:absolute;left:var(--rl,17px);top:var(--top,0);width:2px;height:var(--len,0);border-radius:2px;pointer-events:none}
[data-route]::after{background:var(--surface-3)}
[data-route]::before{z-index:1;background:linear-gradient(180deg,#0071E3,#7C5CF6 55%,#20C48C);transform:scaleY(var(--fill,0));transform-origin:50% 0;box-shadow:0 0 12px rgba(124,92,246,.4)}
.steps-ol[data-route] li::after{display:none}
.steps-ol[data-route] li::before{z-index:2;background:var(--surface-3);color:var(--ink);box-shadow:0 0 0 5px var(--surface);transition:background-color .4s,color .4s,box-shadow .5s}
.steps-ol[data-route] li.on::before{background:var(--g-indigo);color:#fff;box-shadow:0 0 0 5px var(--surface),0 4px 14px rgba(88,86,214,.35);animation:node-pop .55s var(--spring)}
@keyframes node-pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.about dl[data-route]{--rl:6px;padding-left:36px}
.about dl[data-route] dt{position:relative}
.about dl[data-route] dt::before{content:"";position:absolute;left:-36px;top:.3em;width:14px;height:14px;border-radius:50%;background:var(--surface-3);box-shadow:0 0 0 4px var(--bg);z-index:2;transition:background-color .4s}
.about dl[data-route] dt.on::before{background:#7C5CF6;animation:node-pop .55s var(--spring)}
/* Bursts of little shapes on ticks and saves */
.bst{position:fixed;left:0;top:0;width:7px;height:7px;z-index:300;pointer-events:none}
.bst-0{border-radius:50%}.bst-1{border-radius:2px}.bst-2{width:9px;height:9px;clip-path:polygon(50% 0,100% 100%,0 100%)}
/* Fair price: the band your amount falls in lights up as you type */
.bands li[data-k]{margin:0 -14px;padding:14px;border-radius:14px;transition:background-color .35s var(--ease)}
.bands li[data-k] .sw{transition:transform .5s var(--spring),box-shadow .5s var(--ease)}
.bands li.hot{background:color-mix(in srgb,var(--kc) 14%,transparent)}
.bands li.hot .sw{transform:scale(1.45);box-shadow:0 0 0 5px color-mix(in srgb,var(--kc) 24%,transparent)}
/* Entrance choreography, on navigation only */
@keyframes rise-in{from{opacity:0;transform:translateY(26px);filter:blur(8px)}}
@keyframes row-in{from{opacity:0;transform:translateX(-18px)}}
@keyframes tile-pop{from{opacity:0;transform:scale(.4) rotate(-25deg)}}
@keyframes lead-draw{from{transform:scaleX(0)}}
main.fresh .phead .kn{animation:rise-in .7s var(--ease-out) backwards}
main.fresh .phead .h1{animation:rise-in .9s var(--ease-out) .06s backwards}
main.fresh .phead .lead{animation:rise-in .9s var(--ease-out) .16s backwards}
main.fresh .office-page .ghead,main.fresh .office-page .crumbs{animation:rise-in .8s var(--ease-out) backwards}
main.fresh .sec-top .tile{animation:tile-pop .75s var(--spring) .05s backwards}
main.fresh .sec-top>div,main.fresh .sec-of{animation:rise-in .7s var(--ease-out) .1s backwards}
main.fresh .answer-line{animation:rise-in .8s var(--ease-out) .14s backwards}
main.fresh .answer-meta{animation:rise-in .8s var(--ease-out) .2s backwards}
main.fresh .checklist .ck{animation:row-in .6s var(--ease-out) backwards;animation-delay:calc(.22s + var(--i,0) * 45ms)}
main.fresh .fees .fee{animation:row-in .6s var(--ease-out) backwards;animation-delay:calc(.2s + var(--i,0) * 60ms)}
main.fresh .fee .lead{transform-origin:0 50%;animation:lead-draw .8s var(--ease-out) backwards;animation-delay:calc(.3s + var(--i,0) * 60ms)}
main.fresh .steps-ol li{animation:rise-in .6s var(--ease-out) backwards;animation-delay:calc(.15s + var(--i,0) * 70ms)}
main.fresh .q3>div{animation:rise-in .7s var(--ease-out) backwards;animation-delay:calc(.2s + var(--i,0) * 90ms)}
main.fresh .slip-stage,main.fresh .skiptrip{animation:rise-in .8s var(--ease-out) .12s backwards}
@keyframes vt-out{to{opacity:0;transform:scale(.99)}}
@keyframes vt-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
main.enter{animation:vt-in .5s var(--ease-out) both}

/* ================================================================
   SOURCES: where each fee and document comes from, and when it was
   last checked. Data comes from the database (p3b_db.js).
   ================================================================ */
.src{display:flex;flex-wrap:wrap;align-items:baseline;flex-basis:100%;margin-top:4px;font-size:.75rem;font-weight:500;line-height:1.4;color:var(--ink-3);letter-spacing:0}
.src a{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:2px;transition:color .2s}
.src a:hover{color:var(--link);text-decoration-color:currentColor}
.src a+.src-on::before{content:"·";margin:0 7px}
p.src{margin:0 0 8px}
.grp>p.src{clear:both;margin:-2px 0 6px;padding:0 12px}
.notes+p.src{margin-top:10px}
.feetable td .src{font-weight:500}
/* While the guides load from the database */
.data-state{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.data-state .lead{color:var(--ink-2)}
.ds-spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--hair);border-top-color:var(--accent);animation:spin .9s linear infinite}
.ds-slow{max-width:34ch}
/* Shown while the site uses its saved copy because the server can't be reached */
.data-note{display:flex;justify-content:center;padding:12px var(--gut) 0}
.data-note[hidden]{display:none}
.data-note p{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 10px;max-width:780px;padding:6px 8px 6px 16px;border-radius:22px;background:var(--amber-soft);color:var(--ink);font-size:.875rem;font-weight:500;line-height:1.4;text-align:center}
.data-note .btn-text{min-height:34px;font-size:.875rem;font-weight:600}
.dot-warn{background:var(--amber)}
